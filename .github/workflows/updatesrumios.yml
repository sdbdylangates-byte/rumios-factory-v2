name: Build RumiOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo docker image prune -a -f
          df -h

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget curl

      - name: Download Base and Build
        run: |
          # Replace the URL below with your actual direct download link
          # If it's a 404, ensure this link is still active in your browser first!
          URL="https://your-direct-link-to-base.zip"
          
          echo "Starting download for RumiOS base..."
          wget -q --show-progress "$URL" -O pixel_base.zip || { echo "Error: Download failed with 404"; exit 1; }
          
          echo "Extracting files..."
          unzip pixel_base.zip -d build_dir/
          
          # Add your OS build commands here
          echo "Building RumiOS..."

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: RumiOS-Build
          path: build_dir/*.zip
