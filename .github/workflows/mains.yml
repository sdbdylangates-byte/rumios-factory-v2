name: RumiOS GSI Build Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Storage Space
        run: |
          echo "Clearing space for GSI compilation..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f
          df -h

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip wget curl sed

      - name: Download Base GSI
        run: |
          # --- YOU MUST PUT A REAL LINK HERE ---
          # Example: https://github.com/phhusson/treble_experimentations/releases/download/v2023.01.01/system.img.xz
          export GSI_SOURCE_URL="REPLACE_WITH_YOUR_LINK"
          # -------------------------------------

          if [ "$GSI_SOURCE_URL" == "REPLACE_WITH_YOUR_LINK" ]; then
            echo "ERROR: No download link provided in the .yml file."
            exit 1
          fi

          echo "Downloading base image for RumiOS..."
          curl -L -o base_image.zip "$GSI_SOURCE_URL"
          
          if file base_image.zip | grep -q "archive"; then
             echo "Download Complete."
          else
             echo "Error: The link provided is not a valid file (Check for 404)."
             exit 1
          fi

      - name: RumiOS Universal Optimization
        run: |
          mkdir -p build_dir
          unzip base_image.zip -d build_dir/
          
          # Universal GSI Fix: Remove all device-specific restrictions (Error 7)
          # This ensures it runs on any Treble-enabled device.
          find build_dir/ -name "updater-script" -exec sed -i '/assert/d' {} +
          
          echo "Setting RumiOS System Properties..."
          # Adding universal tags to the build.prop
          echo "ro.system.build.id=RumiOS-GSI-v1" >> build_dir/system/build.prop
          echo "ro.product.model=RumiOS Universal" >> build_dir/system/build.prop
          echo "ro.rumios.version=1.0-Vanilla" >> build_dir/system/build.prop

      - name: Package RumiOS GSI
        run: |
          cd build_dir
          zip -r ../RumiOS_Universal_GSI.zip .
          cd ..

      - name: Upload Final GSI
        uses: actions/upload-artifact@v4
        with:
          name: RumiOS-GSI-Output
          path: RumiOS_Universal_GSI.zip
